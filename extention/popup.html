<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RAG Integration</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 400px;
      padding: 10px;
    }
    textarea, input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 10px;
      padding: 8px;
    }
    button {
      padding: 8px 12px;
      margin-right: 5px;
      cursor: pointer;
    }
    #response {
      white-space: pre-wrap;
      background: #f4f4f4;
      padding: 10px;
      border-radius: 4px;
      min-height: 50px;
      margin-top: 10px;
    }
    #docs-list {
      max-height: 150px;
      overflow-y: auto;
      border: 1px solid #ccc;
      padding: 5px;
      margin-top: 10px;
    }
    .doc-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
    }
  </style>
</head>
<body>
  <h2>RAG Chat</h2>
  <textarea id="query" rows="3" placeholder="Enter your question here..."></textarea>
  <button id="sendQuery">Send Query</button>
  <div id="response"></div>

  <h2>Upload Document</h2>
  <input type="file" id="fileInput" />
  <button id="uploadFile">Upload</button>
  <div id="uploadStatus"></div>

  <h2>Documents</h2>
  <div id="docs-list"></div>

  <script src="popup.js"></script>
</body>
</html>
