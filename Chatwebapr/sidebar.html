<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission Bot</title>

    <style>
        /* --- Basic Utility Styles (Mimicking Tailwind classes used) --- */
        /* This is a simplified representation. A real build output is more comprehensive. */
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .flex-grow { flex-grow: 1; }
        .flex-shrink-0 { flex-shrink: 0; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .justify-start { justify-content: flex-start; }
        .flex-wrap { flex-wrap: wrap; }
        .h-screen { height: 100vh; }
        .p-1 { padding: 0.25rem; }
        .p-3 { padding: 0.75rem; }
        .p-4 { padding: 1rem; }
        .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .py-1\.5 { padding-top: 0.375rem; padding-bottom: 0.375rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .pt-3 { padding-top: 0.75rem; }
        .pb-2 { padding-bottom: 0.5rem; }
        .ml-2 { margin-left: 0.5rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .gap-2 { gap: 0.5rem; } /* Added based on usage */
        .space-y-4 > :not([hidden]) ~ :not([hidden]) { --tw-space-y-reverse: 0; margin-top: calc(1rem * (1 - var(--tw-space-y-reverse))); margin-bottom: calc(1rem * var(--tw-space-y-reverse)); }
        .w-full { width: 100%; }
        .max-w-\[85\%\] { max-width: 85%; }
        .overflow-y-auto { overflow-y: auto; }
        .rounded-lg { border-radius: 0.5rem; }
        .rounded-md { border-radius: 0.375rem; }
        .rounded-bl-none { border-bottom-left-radius: 0px; }
        .border { border-width: 1px; }
        .border-t { border-top-width: 1px; }
        .border-slate-700\/50 { border-color: rgba(51, 65, 85, 0.5); }
        .border-slate-600\/50 { border-color: rgba(71, 85, 105, 0.5); }
        .bg-transparent { background-color: transparent; }
        .bg-slate-800\/80 { background-color: rgba(30, 41, 59, 0.8); }
        .bg-slate-700 { background-color: #334155; }
        .bg-slate-700\/50 { background-color: rgba(51, 65, 85, 0.5); }
        .text-left { text-align: left; }
        .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
        .text-base { font-size: 1rem; line-height: 1.5rem; }
        .font-medium { font-weight: 500; }
        .font-semibold { font-weight: 600; }
        .leading-relaxed { line-height: 1.625; }
        .text-white { color: #fff; } /* Simplified */
        .text-slate-200 { color: #e2e8f0; } /* Simplified */
        .text-slate-300 { color: #cbd5e1; } /* Simplified */
        .text-slate-400 { color: #94a3b8; } /* Simplified */
        .text-blue-400 { color: #60a5fa; } /* Simplified */
        .placeholder-slate-400\/80::placeholder { color: rgba(148, 163, 184, 0.8); }
        .shadow { box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1); } /* Simplified */
        .shadow-sm { box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); } /* Simplified */
        .transition-colors { transition-property: color, background-color, border-color, text-decoration-color, fill, stroke; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 0.15s; }
        .transition-shadow { transition-property: box-shadow; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 0.15s; } /* Simplified */
        .transition-all { transition-property: all; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 0.15s; }
        .duration-200 { transition-duration: 0.2s; }
        .backdrop-blur-sm { backdrop-filter: blur(4px); } /* Simplified */
        .hover\:text-slate-200:hover { color: #e2e8f0; } /* Simplified */
        .hover\:bg-slate-700:hover { background-color: #334155; } /* Simplified */
        /* Added hover for general bg */
        .hover\:bg-slate-800:hover { background-color: #1e293b; } /* Simplified */
        .hover\:bg-blue-700:hover { background-color: #1d4ed8; } /* Added hover for blue button */


        /* --- Original Custom Styles --- */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            /* Removed Google Fonts links, relying on system sans-serif */
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Darker Slate Blue */
            color: #e2e8f0; /* Light Slate Gray */
            overflow: hidden; /* Prevent body scroll */
        }

        /* Custom scrollbar for chat area */
        .chat-area::-webkit-scrollbar {
            width: 5px;
        }
        .chat-area::-webkit-scrollbar-track {
            background: transparent; /* Make track invisible */
        }
        .chat-area::-webkit-scrollbar-thumb {
            background: #334155; /* Medium Slate */
            border-radius: 10px;
        }
        .chat-area::-webkit-scrollbar-thumb:hover {
            background: #475569; /* Lighter Slate */
        }

        /* Input focus ring */
        #user-input:focus {
            outline: none;
            box-shadow: none; /* Tailwind focus is overridden by parent */
        }
        .input-container:focus-within {
             box-shadow: 0 0 0 2px #2563eb; /* Blue focus ring */
        }

        /* Send button style */
        .send-button {
            background-color: #2563eb; /* Blue */
            transition: background-color 0.2s ease;
        }
        .send-button:hover {
            background-color: #1d4ed8; /* Darker Blue */
        }

         /* Capture button style */
        .capture-button {
            background-color: #475569; /* Slate 600 */
            transition: background-color 0.2s ease;
        }
        .capture-button:hover {
            background-color: #64748b; /* Slate 500 */
        }


        /* Suggested button style */
        .suggested-button {
             background-color: #1e293b; /* Darker Slate */
             border: 1px solid #334155; /* Slate border */
             transition: all 0.2s ease;
        }
        .suggested-button:hover {
             background-color: #334155; /* Slate hover */
             border-color: #475569;
             transform: translateY(-1px); /* Subtle lift */
        }

        /* Chat message animation */
        .chat-message {
            opacity: 0;
            transform: scale(0.95) translateY(10px);
            animation: messageFadeIn 0.3s ease forwards;
        }
        @keyframes messageFadeIn {
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* Subtle background gradient for the bottom area */
        .bottom-gradient {
            background: linear-gradient(to top, rgba(15, 23, 42, 1), rgba(15, 23, 42, 0.8));
        }

        /* improvements */
        @keyframes spin {
    to { transform: rotate(360deg); }
}
.animate-spin {
    animation: spin 1s linear infinite;
}
.spinner {
    border-top-color: #60a5fa; /* blue-400 */
}
/* Fade-in animation for messages */
@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
.animate-fade-in-up {
  animation: fadeInUp 0.4s ease forwards;
}

#user-input:disabled {
    background-color: rgba(100, 116, 139, 0.5); /* Grayish background */
    cursor: not-allowed;
}
#send-button:disabled {
    background-color: rgba(100, 116, 139, 0.5);
    cursor: not-allowed;
}




    </style>
</head>
<body class="flex flex-col h-screen">

    <header class="p-3 border-b border-slate-700/50 flex items-center justify-between flex-shrink-0 bg-slate-800/80 backdrop-blur-sm shadow-sm">
        <h1 class="text-base font-semibold flex items-center gap-2 text-slate-200">
             <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-graduation-cap text-blue-400"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0l8.59-3.9z"/><path d="M6 12v5c0 1.66 2.69 3 6 3s6-1.34 6-3v-5"/><path d="M6 12.247 4.5 11.5v3c0 1.21.97 2.29 2.21 2.55A10 10 0 0 0 12 21a10 10 0 0 0 5.29-3.95C18.53 16.79 19.5 15.71 19.5 14.5v-3L18 12.247"/></svg>
            AMU Admission Assistant
        </h1>
         <button class="text-slate-400 hover:text-slate-200 transition-colors duration-200 p-1 rounded-full hover:bg-slate-700">
             <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-settings"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
         </button>
         <button id="clear-history-button" class="text-slate-400 hover:text-slate-200 transition-colors duration-200 p-1 rounded-full hover:bg-slate-700 ml-2">
            🗑️
        </button>
        
    </header>

    <div id="chat-area" class="flex-grow p-4 overflow-y-auto chat-area space-y-4">
        <div class="flex justify-start chat-message">
            <div class="bg-slate-700 rounded-lg rounded-bl-none p-3 max-w-[85%] shadow">
                <p class="text-sm leading-relaxed text-slate-200">Hello! I'm the Admission Assistant. Ask me about deadlines, programs, scholarships, or anything else related to applying!</p>
            </div>
        </div>
    </div>

    <div class="flex-shrink-0 border-t border-slate-700/50 bottom-gradient pt-3">
        <div class="px-4 pb-2">
            <h3 class="text-xs text-slate-400 mb-2 font-medium">Try asking:</h3>
            <div class="flex flex-wrap gap-2">
                 <button class="suggested-button flex-grow text-left px-3 py-1.5 rounded-md text-sm text-slate-300">
                     Application Deadlines?
                 </button>
                 <button class="suggested-button flex-grow text-left px-3 py-1.5 rounded-md text-sm text-slate-300">
                      Scholarship Options?
                 </button>
                 <button class="suggested-button flex-grow text-left px-3 py-1.5 rounded-md text-sm text-slate-300">
                      Engineering Programs?
                 </button>
            </div>

            <!-- added button for autofill  -->
            <div class="flex flex-col items-center mt-4">
                <button id="navigate-to-flask" class="px-4 py-2 rounded-md text-white bg-slate-700 hover:bg-blue-700 text-sm font-semibold">
                 Auto Form Fill
                </button>
              </div>
              
            <!-- <div class="flex flex-wrap gap-2 pt-3">
                <a href="https://d6a3-2409-40d2-4f-a325-ec1c-da01-4e03-eb4f.ngrok-free.app" 
                   class="auto-fill flex-grow text-left px-3 py-1.5 rounded-md text-sm text-slate-300 text-center border border-slate-700/50">
                    AUTO FORM FILL
                </a>
            </div> -->
        </div>

        <div class="p-3">
            <div class="flex items-center bg-slate-700/50 rounded-lg p-1 input-container transition-shadow duration-200 border border-slate-600/50">
                <input type="text" id="user-input" class="flex-grow bg-transparent text-slate-200 placeholder-slate-400/80 focus:outline-none text-sm px-3 py-2" placeholder="Ask anything...">
                <!-- add image -->
                <div id="image-preview" style="margin-top: 8px; display: none; align-items: center;">
                    <img id="preview-image" src="" alt="Screenshot Preview" style="max-height: 100px; border-radius: 8px; margin-right: 8px; display: block;">
                    <button id="remove-preview" style="background: red; color: white; border: none; border-radius: 5px; padding: 4px 8px; cursor: pointer;">✖ Remove</button>
                  </div>
                  
                  <!-- to here  -->
                  
                <button id="capture-button" class="ml-2 p-2 rounded-md text-white capture-button flex-shrink-0 flex items-center justify-center shadow-md">
                     <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-camera"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
                 </button>
                 <button id="stop-typing-button" style="display: none; position: fixed; bottom: 100px; right: 20px; background-color: red; color: white; border: none; border-radius: 5px; padding: 8px 12px; cursor: pointer; z-index: 1000;">🛑 Stop Typing</button>

                <button id="send-button" class="ml-2 p-2 rounded-md text-white send-button flex-shrink-0 flex items-center justify-center shadow-md">
                     <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-send-horizontal"><path d="m3 3 3 9-3 9 19-9Z"/><path d="M6 12h16"/></svg>
                </button>
            </div>
        </div>
    </div>
