<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document Upload | Admission Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-6">
    <div class="bg-white shadow-xl rounded-lg p-8 w-full max-w-2xl">
        <h1 class="text-3xl font-bold text-center text-indigo-600 mb-6">Upload Your Documents</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="mb-4 p-3 text-white rounded {{ 'bg-red-500' if category == 'danger' else 'bg-yellow-400' }}">
                  {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" enctype="multipart/form-data" class="space-y-5">
            <div>
                <label class="block mb-1 font-medium">Google API Key</label>
                <input type="text" name="api_key" placeholder="Enter your API Key"
                       class="w-full border border-gray-300 p-3 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
            </div>

            <div>
                <label class="block mb-1 font-medium">Upload Aadhaar Card</label>
                <input type="file" name="aadhaar_file"
                       class="w-full border border-gray-300 p-3 rounded bg-white" accept="image/*" required>
            </div>

            <div>
                <label class="block mb-1 font-medium">Upload 10th Marksheet</label>
                <input type="file" name="marksheet_file"
                       class="w-full border border-gray-300 p-3 rounded bg-white" accept="image/*" required>
            </div>

            <div class="text-center">
                <button type="submit"
                        class="mt-4 bg-indigo-600 text-white py-2 px-6 rounded hover:bg-indigo-700 transition">
                    Submit Documents
                </button>
            </div>
        </form>
        {% if raw_output %}
          <div class="mt-8 p-4 bg-gray-100 rounded">
            <h2 class="font-semibold">Debug: Raw Model Output</h2>
            <pre class="whitespace-pre-wrap text-sm">{{ raw_output }}</pre>
          </div>
        {% endif %}
    </div>
</body>
</html>
